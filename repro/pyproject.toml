[project]
name = "killfield-reference-cpu-runtime"
version = "0.0.1"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy==2.5.2", "torch==2.13.0+cpu"]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
